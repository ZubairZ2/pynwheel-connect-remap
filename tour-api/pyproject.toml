[project]
name = "pynwheel-tour-api"
version = "0.1.0"
description = "Pynwheel Tour App API: the FastAPI layer the Capacitor Tour App talks to, over the existing Pynwheel database and Rails authentication."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local development database and (for login) the local Rails CMS"]
addopts = "-q"
