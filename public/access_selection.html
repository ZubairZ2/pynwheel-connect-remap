<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo-small.png" type="image/icon type">
    <title>Pynwheel Multiple Access Selection</title>
    <style>
        html {
        box-sizing: border-box;
        font-size: 16px;
        }

        *, *:before, *:after {
        box-sizing: inherit;
        }

        body, h1, h2, h3, h4, h5, h6, p, ol, ul {
        margin: 0;
        padding: 0;
        font-weight: normal;
        }

        ol, ul {
        list-style: none;
        }

        img {
        max-width: 100%;
        height: auto;
        }

    .multiple-access-background {
        display: flex;
        height: 100vh;
        width: 100vw;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: "#dfbb33";
        background-image: linear-gradient(315deg, #dfbb33 0%, #008ed1 74%);
    }

    .multiple-access-title{
        font-size: 2.5rem;
        color: white;
        font-weight: 500;
        font-family: Raleway, sans-serif !important;
        margin-bottom: 50px;
    }

    .multiple-access-p {
        font-size: 1rem;
        color: white;
        font-weight: 500;
        font-family: Raleway, sans-serif !important;
        margin-bottom: 20px;
    }

    .multiple-access-body {
        display: flex;
        justify-content: space-evenly;
    }

    .multiple-access-body-items{
        width: 26%;
        text-align: center;
    }

    @media only screen and (min-width: 700px) and (max-width: 991px) {
        .multiple-access-background {
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
    }

    .multiple-access-title{
        margin-top: 100px;
        font-size: 2rem;
        margin-bottom: 50px;
    }

    .multiple-access-body-items{
        width: 40%;
    }
    }

    @media only screen and (max-width: 700px) {
        .multiple-access-background {
        flex-direction: column;
        text-align: center;
        justify-content: flex-start;
        align-items: center;
    }

    .multiple-access-body {
        flex-direction: column;
        align-items: center;
    }

    .multiple-access-title{
        margin-top: 100px;
        font-size: 2rem;
        margin-bottom: 50px;
    }

    .multiple-access-body-items{
        margin-bottom: 50px;
        width: 80%;
    }
    }
    </style>
</head>
<body>
    <div class="multiple-access-background">
        <div class="multiple-access-title">
            <p>
                Welcome! Please select an option below.
            </p>
        </div>
        <div class="multiple-access-body">
            <div class="multiple-access-body-items">
                <p class="multiple-access-p">
                    Select Pynwheel Launch to set up new apps.
                </p>
                <a id="launch_address" href="https://pynwheellaunch.com">
                    <img src="./pynwheel-launch-logo.png" alt="" width="70%">
                </a>
            </div>
            <div class="multiple-access-body-items">
                <p class="multiple-access-p">
                    Select Pynwheel Connect to manage existing apps.
                </p>
                <a id="connect_address" href="https://pynwheelconnect.com">
                    <img src="./pynwheel-connect-logo.png" alt="" width="70%">
                </a>
            </div>
        </div>
    </div>
    <script>
        if (location.host.includes("qa")){
            document.getElementById('launch_address').href="https://pynwheel-user-portal-staging.herokuapp.com/";
            document.getElementById('connect_address').href="https://pynwheel-qa.herokuapp.com/users/sign_in";
        } else if (location.host.includes("staging")){
            document.getElementById('launch_address').href="https://pynwheel-user-portal-staging.herokuapp.com/";
            document.getElementById('connect_address').href="https://pynwheel-staging.herokuapp.com/";
        }
    </script>
</body>
</html>
