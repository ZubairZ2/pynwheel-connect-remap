<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pynwheel Multiple Access Selection</title>
    <style>
        html {
        box-sizing: border-box;
        font-size: 16px;
        }

        *, *:before, *:after {
        box-sizing: inherit;
        }

        body, h1, h2, h3, h4, h5, h6, p, ol, ul {
        margin: 0;
        padding: 0;
        font-weight: normal;
        }

        ol, ul {
        list-style: none;
        }

        img {
        max-width: 100%;
        height: auto;
        }

    .multiple-access-background {
        display: flex;
        height: 100vh;
        width: 100vw;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: "#dfbb33";
        background-image: linear-gradient(315deg, #dfbb33 0%, #008ed1 74%);
    }

    .multiple-access-title{
        font-size: 2.5rem;
        color: white;
        font-weight: 500;
        font-family: Raleway, sans-serif !important;
        margin-bottom: 100px;
    }

    .multiple-access-p {
        font-size: 1rem;
        color: white;
        font-weight: 500;
        font-family: Raleway, sans-serif !important;
    }

    .multiple-access-body {
        display: flex;
        justify-content: center;
    }

    .multiple-access-body-items{
        width: 22%;
        text-align: center;
    }
    </style>
</head>
<body>
    <div class="multiple-access-background">
        <div class="multiple-access-title">
            <p>
                Welcome! Please select an option below.
            </p>
        </div>
        <div class="multiple-access-body">
            <div class="multiple-access-body-items">
                <p class="multiple-access-p">
                    Select Pynwheel Launch to set up your new apps.
                </p>
                <a href="https://pynwheellaunch.com">
                    <img src="./pyn-launch-logo-img.png" alt="" width="70%">
                </a>
            </div>
            <div class="multiple-access-body-items">
                <p class="multiple-access-p">
                    Select Pynwheel Connect to set up your existing apps.
                </p>
                <a href="https://pynwheelconnect.com">
                    <img src="./pynwheel_connect_logo_v2.png" alt="" width="70%">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
