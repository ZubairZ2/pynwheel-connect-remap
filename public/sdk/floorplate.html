<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PynMap Test</title>
</head>

<body>
  <script src="pyn-map-sdk-v1.js"></script>

  <div id="pynMap" style="width:100%; height:600px;"></div>
  <!-- Width and hight can be ajustable whatever you need. -->

  <script>
    const config = {
      container: "#pynMap",
      environment: "production",
      apiKey: "88ebc96efd10f0b0af44ced6031d8813",
      propertyId: "33",
      mapType: "ops", //optional default "marketing" options: "marketing", "ops"
      defaultFloor: 1,       // Optional
      showZoomControls: true, // Optional

      // 3D map options (both default to false)
      enable3DMap: true,  // shows 3D/2D toggle button under +/- zoom controls
      show3DMap: false,   // set true to open in 3D mode on load

      styles: {
        unitColors: {
          available: "#61D46B",
          hover: "#FFF2AA"
        },
        // unitLabels: {
        //   fontFamily: "Arial, sans-serif",
        //   fontSize: "10px",
        //   fontColor: "#ffffff"
        // }
      }, // Optional

      onUnitHover: (unit) => {
        console.log("Hovered unit:", unit);
      },

      onUnitClick: (unit) => {
        console.log("Clicked unit:", unit);
      }
    };

    PynMapSDK.init(config);
  </script>
</body>
</html>
