<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PynMap Test</title>
</head>

<body>
  <script src="pyn-map-sdk.js"></script>

  <div id="pynMap"></div>
  <!-- THis is SDK code -->
  <!-- Width and hight can be ajustable whatever you need. -->

  <script>
    const config = {
      container: "#pynMap",
      environment: "local",
      apiKey: "88ebc96efd10f0b0af44ced6031d8813",
      propertyId: "33",
      mapType: "ops", //optional default "marketing" options: "marketing", "ops"
      defaultFloor: 1,       // to load default floor of the property

      showZoomControls: true, // ZoomIn, ZoomOut, RestZoom
      enable3DMap: true, // enables 2d/3d controls

      // show3DMap: true,  // defaul load map 3D
      // defaultSatelliteView: true, // To load default satellite view

      styles: {
        unitColors: {
          available: "#61D46B",
          hover: "#FFF2AA"
        },
      //   unitLabels: {
      //     fontFamily: "Arial, sans-serif",
      //     fontSize: "10px",
      //     fontColor: "#ffffff"
      //   }
      }, // Optional

      onUnitHover: (unit) => {
        console.log("Hovered unit:", unit);
      },

      onUnitClick: (unit) => {
        console.log("Clicked unit:", unit);
      },

      onAmenityClick: (amenity) => { 
        console.log("clicked amenity", amenity); 
      },
      onAmenityHover: (amenity) => { 
        console.log("hovered unit", amenity); 
      },

    };

    function makeIcon(color) {
      return "data:image/svg+xml," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="${color}" stroke="#fff" stroke-width="2"/>
          <text x="12" y="16" text-anchor="middle" font-size="16" font-family="Arial" fill="#fff" font-weight="bold">!</text>
        </svg>
      `);
    }

    const PIN_ICON      = makeIcon("#E53935"); // red   — static
    const DRAG_PIN_ICON = makeIcon("#1E88E5"); // blue  — draggable

    const map = PynMapSDK.create(config);
    map.onReady(() => {
      const floor1Units = map.data.units.filter(u => String(u.floor) === "1");

      map.highlightUnits(floor1Units.map(u => u.unitId));

      floor1Units.forEach((u, i) => {
        // Static marker (red) on even-indexed units
        if (i % 2 === 0) {
          map.addMarker({
            id: `marker-${u.unitId}`,
            unitId: u.unitId,
            floor: "1",
            icon: { url: PIN_ICON, size: [34, 34], anchor: [0.5, 0.5] },
            cursor: "pointer",
            onClick: () => console.log("Static marker clicked:", u),
          });
        } else {
          // Draggable marker (blue) on odd-indexed units
          map.addMarker({
            id: `drag-marker-${u.unitId}`,
            unitId: u.unitId,
            floor: "1",
            icon: { url: DRAG_PIN_ICON, size: [34, 34], anchor: [0.5, 0.5] },
            cursor: "grab",
            draggable: true,
            onDrag: (pos) => console.log(`Draggable marker ${u.unitId} moved to:`, pos),
            onClick: () => console.log("Draggable marker clicked:", u),
          });
        }
      });
    });


  </script>
</body>
</html>
