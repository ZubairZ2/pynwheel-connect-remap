name: Deploy SDK (Staging → Production)

on:
  push:
    branches: 
      - main
    paths:
      - "pyn_sdk/**"

jobs:
  deploy-staging:
    name: Deploy SDK to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Build SDK
        working-directory: pyn_sdk
        run: |
          npm install
          npm run build

      - name: Configure AWS Credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload SDK to Staging Bucket
        run: |
          aws s3 cp ../dist/sdk/pyn-map-sdk.js \
            s3://${{ secrets.AWS_S3_BUCKET }}/sdk/pyn-map-sdk.js \
            --acl public-read \
            --cache-control "no-cache"

      - name: Invalidate Staging CDN Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/sdk/pyn-map-sdk.js"


  deploy-production:
    name: Deploy SDK to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production      # Uses production GitHub Environment secrets
      url: "https://cdn.yourproductiondomain.com/sdk/pyn-map-sdk.js"

    # This requires APPROVAL before running — same as Heroku promote
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Build SDK
        working-directory: pyn_sdk
        run: |
          npm install
          npm run build

      - name: Configure AWS Credentials (Production)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload SDK to Production Bucket
        run: |
          aws s3 cp ../dist/sdk/pyn-map-sdk.js \
            s3://${{ secrets.AWS_S3_BUCKET }}/sdk/pyn-map-sdk.js \
            --acl public-read \
            --cache-control "no-cache"

      - name: Invalidate Production CDN Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/sdk/pyn-map-sdk.js"