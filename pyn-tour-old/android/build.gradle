// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
    buildToolsVersion = "34.0.0"
    minSdkVersion = 23
    compileSdkVersion = 34
    targetSdkVersion = 35
    ndkVersion = "27.0.12077973"
}

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:7.4.2')
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            force "com.facebook.soloader:soloader:0.10.5"
            force "com.datadoghq:dd-sdk-android:1.19.3"
        }
    }
    repositories {
        exclusiveContent{
            filter {
                includeGroup "com.facebook.react"
            }
            forRepository {
                maven {
                    url "$rootDir/../node_modules/react-native/android"
                }
            }
        }
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        // maven {
        //     url("https://repo.app.authenteq.com/repository/maven-hosted")
        // }
        maven {
            url "$rootDir/libs"
        }
        flatDir {
            dirs '../libs'
        }
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://maven.teknasyon.com/releases' }
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://maven.google.com' }
    }
}
