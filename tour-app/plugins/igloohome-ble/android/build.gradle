ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

// The igloohome Bluetooth SDK (libs/ble-sdk-release.aar, the file the legacy
// Pynwheel Tour app shipped): package co.igloohome.ble, minSdk 23, Kotlin +
// RxJava 2 at runtime, native libs for arm64-v8a and armeabi-v7a. Its own
// consumer ProGuard rules keep the public API unobfuscated.
android {
    namespace = "com.pynwheel.tour.igloohomeble"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    // The vendored SDK. AGP 8 refuses a direct .aar file dependency inside a library module, so it is
    // resolved as a flatDir artifact; the app project lists this directory in its own flatDir too,
    // because Gradle resolves a project dependency's artifacts with the consuming project's repositories.
    flatDir { dirs 'libs' }
}

dependencies {
    implementation(name: 'ble-sdk-release', ext: 'aar')
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // What the SDK's classes reference at runtime (javap over the AAR: kotlin.*, io.reactivex.*, androidx.annotation).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
