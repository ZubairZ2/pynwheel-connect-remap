ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    // igloohome SDK 3.x (co.igloo.home:sdk): the generation whose Bluetooth guest keys the igloohome API's
    // `/devices/:id/ekey` issues (32-byte guest AES keys; the legacy 16-byte partner keys are accepted too).
    iglooSdkVersion = '3.5.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// The igloohome Bluetooth SDK, from igloohome's GitLab Maven registry (see the root build.gradle for the
// token): package co.igloo.home.sdk over co.igloo.core and co.igloohome:ble-sdk-idp (package co.igloohome.ble,
// the same package as the legacy ble-sdk-release.aar the plugin wrapped until October 2026, so the two
// cannot coexist). minSdk 24, Kotlin 2.1, coroutines / Flow; native libs for arm64-v8a and armeabi-v7a.
android {
    namespace = "com.pynwheel.tour.igloohomeble"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 2
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        name 'igloohome'
        url 'https://gitlab.com/api/v4/projects/64441730/packages/maven'
        credentials(HttpHeaderCredentials) {
            name = 'Private-Token'
            value = project.findProperty('iglooGitlabToken') ?: System.getenv('IGLOO_GITLAB_TOKEN') ?: ''
        }
        authentication {
            header(HttpHeaderAuthentication)
        }
    }
}

if (!project.hasProperty('iglooGitlabToken') && !System.getenv('IGLOO_GITLAB_TOKEN')) {
    logger.warn("igloohome-ble: no iglooGitlabToken Gradle property or IGLOO_GITLAB_TOKEN variable; co.igloo.home:sdk will not resolve. Put the portal's SDK Access token in ~/.gradle/gradle.properties as iglooGitlabToken=…")
}

dependencies {
    implementation "co.igloo.home:sdk:$iglooSdkVersion"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
