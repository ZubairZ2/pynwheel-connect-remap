// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // The @pynwheel/igloohome-ble plugin is Kotlin (the igloohome SDK 3.x API is coroutines and Flow).
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // igloohome's SDK registry (co.igloo.home:sdk and its co.igloo / co.igloohome parts), read with the
        // portal's SDK Access token: `iglooGitlabToken` in ~/.gradle/gradle.properties (never in the repo),
        // or the IGLOO_GITLAB_TOKEN environment variable. Gradle resolves a project dependency's artifacts
        // with the consuming project's repositories, so the registry is declared here for every module.
        maven {
            name 'igloohome'
            url 'https://gitlab.com/api/v4/projects/64441730/packages/maven'
            credentials(HttpHeaderCredentials) {
                name = 'Private-Token'
                value = project.findProperty('iglooGitlabToken') ?: System.getenv('IGLOO_GITLAB_TOKEN') ?: ''
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
